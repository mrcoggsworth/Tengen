apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tengen.fullname" . }}-dashboard
  labels:
    {{- include "tengen.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "tengen.componentLabels" (dict "root" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tengen.componentLabels" (dict "root" . "component" "dashboard") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tengen.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "tengen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "tengen.dashboard_main"]
          env:
            {{- include "tengen.commonEnv" . | nindent 12 }}
            - name: DASHBOARD_HOST
              value: {{ .Values.dashboard.host | quote }}
            - name: DASHBOARD_PORT
              value: {{ .Values.dashboard.port | quote }}
            - name: RABBITMQ_MGMT_URL
              value: {{ printf "http://%s-rabbitmq:15672" .Release.Name | quote }}
            - name: RABBITMQ_USER
              value: {{ .Values.rabbitmq.auth.username | quote }}
            - name: RABBITMQ_PASS
              value: {{ .Values.rabbitmq.auth.password | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/overview
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/overview
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
