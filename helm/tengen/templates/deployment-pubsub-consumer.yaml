{{- if .Values.pubsub.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tengen.fullname" . }}-pubsub-consumer
  labels:
    {{- include "tengen.labels" . | nindent 4 }}
    app.kubernetes.io/component: pubsub-consumer
spec:
  replicas: {{ .Values.pubsub.replicas }}
  selector:
    matchLabels:
      {{- include "tengen.componentLabels" (dict "root" . "component" "pubsub-consumer") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tengen.componentLabels" (dict "root" . "component" "pubsub-consumer") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tengen.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pubsub-consumer
          image: {{ include "tengen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "tengen.consumers.pubsub_consumer"]
          env:
            {{- include "tengen.commonEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.pubsub.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
