apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tengen.fullname" . }}-router
  labels:
    {{- include "tengen.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  replicas: {{ .Values.router.replicas }}
  selector:
    matchLabels:
      {{- include "tengen.componentLabels" (dict "root" . "component" "router") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap-n8n-routes.yaml") . | sha256sum }}
        checksum/secret: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tengen.componentLabels" (dict "root" . "component" "router") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tengen.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: router
          image: {{ include "tengen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "tengen.router_main"]
          env:
            {{- include "tengen.commonEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
          volumeMounts:
            {{- include "tengen.n8nRoutesVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "tengen.n8nRoutesVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
